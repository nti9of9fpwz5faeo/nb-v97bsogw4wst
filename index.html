<script>
// ===== 設定 =====
// 曲リスト（bpm＝テンポ、offset＝最初のドンまでの秒数）
const SONGS = [
  { name: 'チュートリアル', file: 'audio/tutorial.mp3', bpm: 100, offset: 0.07, level: 'はじめて', tutorial: true },   // Neon Warmup（SUNO）
  { name: 'Shatter Forward', file: 'audio/shatter_forward.mp3', bpm: 130.3, offset: .002, level: '曲専用譜面', chart: 'charts/shatter_forward.json' },
  { name: 'Zombie Protocol',     file: 'audio/song.mp3',    bpm: 129,   offset: 0.34, level: 'ふつう' },
  { name: 'Stutter Bass Groove', file: 'audio/stutter.mp3', bpm: 150.1, offset: 0.0,  level: 'はやい', hard: true },
  { name: 'Bass Arcade',         file: 'audio/bass_arcade.mp3', bpm: 134.4, offset: 0.085, level: 'むずかしい', hard: true, dense: true },
  { name: 'Frostbite Breakbeat', file: 'audio/frostbite.mp3', bpm: 129.9, offset: 0.21, level: 'クール', hard: true },
];
let difficulty='normal';
try{if(localStorage.getItem('neon-blade-difficulty')==='hard')difficulty='hard';}catch(e){}
const DIFFICULTIES={normal:{maxRun:4,gaps:[1,1,2,2,3],dense:[1,1,1,2,3],hardRate:.12},hard:{maxRun:6,gaps:[1,1,1,2,2,3],dense:[1,1,1,1,2,3],hardRate:.28}};
let song = SONGS[0], BPM, OFFSET, SPB, WINDOW;
const chartCache={};
let activeChart=null;
// エンドレス：1周するごとに曲もノーツも速くなる（ゴールなし）
let endless=false,lap=0,rate=1;
try{endless=localStorage.getItem('neon-blade-endless')==='1';}catch(e){}
function applyRate(){ BPM = song.bpm * rate; OFFSET = song.offset / rate; SPB = 60 / BPM; WINDOW = Math.min(0.17, SPB * 0.36); }
function updateEndlessUI(){ document.getElementById('endlessBtn').setAttribute('aria-pressed',String(endless)); }
function setSong(sg){ song = sg; activeChart=chartCache[sg.chart]||null; GAPS = sg.dense ? DIFFICULTIES[difficulty].dense : DIFFICULTIES[difficulty].gaps; applyRate(); }
const COLS = 8, ROWS = 11;

const GATE_PERFECT = 3;   // 区間の出口の門を開けるのに必要なPERFECTの累計回数

function enterSection(t){
  diagEv('gate_pass', { passedSection: sectionNo, perfects: secPerfect, ...diagCtx() });
  sectionNo++; secPerfect = 0; gateOpen = false; lampAt = []; gateOpenAt = -9;
}
// 区間内の有効なPERFECTを1回数える。3回で門が開く（開いたあとは数えない・再ロックしない）
function countPerfect(t){
  if (!endlessScoreOn() || gateOpen) return;
  secPerfect++; lampAt[secPerfect - 1] = t;
  uiTone(880 + secPerfect * 110, .06);
  if (secPerfect >= GATE_PERFECT){
    gateOpen = true; gateOpenAt = t;
    [784, 988, 1175].forEach((f, i) => uiTone(f, .09, i * .04));
    texts.push({ s: 'OPEN!', idx: gateCell(), t, col: '#c6ff44' });
  }
  diagEv(gateOpen ? 'gate_open' : 'gate_lamp', { section: sectionNo, perfects: secPerfect, ...diagCtx() });
}

const G_AHEAD = 4;        // Gはラインの何マス先に置くか

// ===== コース（ジグザグ） =====
// 長い直線 → 中くらい → 短い折り返し → 長い直線。最後の4マスは出現口用。
const path = [];
const WAYPOINTS = [[7,0],[0,0],[0,2],[5,2],[5,4],[2,4],[2,6],[7,6],[7,8],[0,8],[0,10],[2,10]];
for(let k=0;k<WAYPOINTS.length;k++){
  const [c,r]=WAYPOINTS[k];
  if(!k){path.push({c,r});continue;}
  const last=path[path.length-1],dc=Math.sign(c-last.c),dr=Math.sign(r-last.r);
  for(let x=last.c+dc,y=last.r+dr;;x+=dc,y+=dr){path.push({c:x,r:y});if(x===c&&y===r)break;}
}
// 縦の区間では直前の左右向きを維持する。
function facesRight(idx){
  for(let i=Math.min(idx,path.length-2);i>=0;i--){
    const dx=path[i+1].c-path[i].c;if(dx)return dx>0;
  }
  return false;
}
const EXIT_INDEX = path.length - 1;

  const im=heroImages[id],n=Math.max(0,['idle','move','slash','damage'].indexOf(pose));
  if(!im)return null;

function renderHeroCanvas(canvas,id,pose='idle'){

function fillGap(from, to, t){
  if(activeChart){pendingExtension={from,to};chartFill(Math.max(INTRO_BEATS,nextBeat-1),t);return;}
  let last = Math.max(-99, ...notes.map(x => x.idx));
  let i = Math.max(from, last + pickGap());
  while (i <= to){
    notes.push({ id: noteId++, idx: i, from: i, at: t, pop: t + (i - from) * 0.03, hp: rollHp(i - last) });
    last = i; i += pickGap();
  }
}

// Use the device-output clock for visuals and judging, not frame-count accumulation.

try{const v=Number(localStorage.getItem('neon-blade-timing-ms'));if(Number.isFinite(v))timingMs=Math.max(-250,Math.min(250,v));}catch(e){}
function syncClock(){clockOffset=ctx.currentTime-performance.now()/1000;}
function outputTime(){
  const now=performance.now();
  if(ctx.getOutputTimestamp){
    const ts=ctx.getOutputTimestamp();
    if(ts.contextTime>0&&ts.performanceTime>0&&Math.abs(now-ts.performanceTime)<250)
      return Math.min(ctx.currentTime,ts.contextTime+(now-ts.performanceTime)/1000);
  }
  return ctx.currentTime-(ctx.outputLatency||0)-(ctx.baseLatency||0);
}
function songTime(){
  if((state==='paused'||state==='resuming')&&pausedAt!==null)return pausedAt;
  const t=outputTime()-songStart-timingMs/1000;
  if(t>=resumeFloor)resumeFloor=-Infinity;
  return Math.max(resumeFloor,t);
}
function beatTime(n){
  const beats=activeChart?.beats;
  if(!beats)return OFFSET+n*SPB;
  if(n<0)return beats[0]/rate+n*SPB;
  if(n>=beats.length)return beats[beats.length-1]/rate+(n-beats.length+1)*SPB;
  return beats[n]/rate;
}
// beatTime() と同じ時間の基準（再生倍率で割った実時間）で一番近い拍を探す
function nearestBeat(t){
  if(!activeChart)return Math.round((t-OFFSET)/SPB);
  const b=activeChart.beats,first=b[0]/rate,last=b[b.length-1]/rate;
  if(t<first)return Math.round((t-first)/SPB);
  if(t>last)return b.length-1+Math.round((t-last)/SPB);
  const x=t*rate;
  let lo=0,hi=b.length-1;
  while(lo<hi){const m=(lo+hi)>>1;if(b[m]<x)lo=m+1;else hi=m;}
  return lo>0&&x-b[lo-1]<b[lo]-x?lo-1:lo;
}
function chartSpawns(n){return !!activeChart?.spawn[runDifficulty]?.[n];}
function chartFill(n,t){
  if(!pendingExtension)return;
  const {from,to}=pendingExtension;pendingExtension=null;
  for(let i=Math.max(player.idx+1,from-1);i<to;i++){
    if(chartSpawns(n-(to-i))&&!notes.some(nt=>nt.idx===i))
      notes.push({id:noteId++,idx:i,from:i,at:t,pop:t,hp:rollHp(gapBefore(i))});
  }
}

// ノーツ密度を上げ、連続ノーツの後には進める間隔を必ず作る。
let GAPS=DIFFICULTIES.normal.gaps;
// かたいブロック（2回ブレイクで壊れる）。1回目は手前のマスにいるうちに割る
function rollHp(gap){ // 手前が空いてる（gap2以上）ときだけ、かたいブロックにする
  if(isTutorial())return 1;   // チュートリアルの本番パートは青ブロックなし
  return gap >= 2 && rand() < (DIFFICULTIES[difficulty].hardRate || 0) ? 2 : 1;
}
function gapBefore(i){ const prev = notes.filter(x => x.idx < i).map(x => x.idx); return prev.length ? i - Math.max(...prev) : 99; }
let nextGap=4,runLen=1;
function pickGap(){
  if(isTutorial())return 3+Math.floor(rand()*2);   // チュートリアルは終始ゆったり（3〜4マス空ける、連打なし）
  let gp=GAPS[Math.floor(rand()*GAPS.length)];
  if(runLen>=DIFFICULTIES[difficulty].maxRun)gp=3;
  runLen=gp===1?runLen+1:1;
  return gp;
}

// スポットライト：最初の1回だけ「ブロックが出た」→「ブレイクのボタン」→「進むのボタン」を順に注視させる

function onBeat(n, t){
  // 赤いブロックが残っている間は全部その場で足踏み。ただし1拍だけ。
  const red = notes.find(nt => nt.hit);
  if (red && n > (red.hitBeat ?? n) + 1 && !tutSafe()){     // 1拍待っても壊せてない → ダメージ
    notes.splice(notes.indexOf(red), 1);
    damage(t, '赤ノーツを1拍以内に壊せなかった', red, null);
  }
  // 練習中は、ブロックが目の前に来たらプレイヤーが押すまで待つ
  const frozen = notes.some(nt => nt.hit) || tutFreeze() || (tutWait() && notes.some(nt => nt.idx <= player.idx));
  if (n >= INTRO_BEATS && notes.length){
    for (const nt of notes){
      nt.from = nt.idx;
      if (frozen){ nt.at = t; nt.spin = t; } else { nt.at = t - MOVE_ANIM; nt.idx -= 1; nt.spin = null; } // 表示は拍ちょうどに到着済み
    }
    if(!moveScheduler)playMoveSE(n);
  }
  if(activeChart&&n>=INTRO_BEATS)chartFill(n,t);
  // ブロックを出す
  if (tutSingle()){ if(!frozen) tutBeat(t); }
  else if (tutSt() && !tutSt().spawn){ /* 練習中はブロックを出さない */ }
  else if (n >= INTRO_BEATS && !frozen){
    const lastIdx = Math.max(-99, ...notes.map(x => x.idx));
    if (activeChart ? chartSpawns(n)&&lastIdx<gIdx : gIdx - lastIdx >= nextGap){
      notes.push({ id: noteId++, idx: gIdx, from: gIdx, at: t, pop: t, hp: rollHp(gIdx - lastIdx) });
      if(!activeChart)nextGap = pickGap();

  }
  lastBeatAt = t;lastBeatStrength=activeChart?.accents[n]??1;

  if (earlyInput){
    if (earlyInput.n === n){ const q = earlyInput; earlyInput = null; doAction(q.type, n, t, q.diff, q.rec); }
    else if (earlyInput.n < n){ diagEv('input_expired', { inputId: earlyInput.rec?.inputId ?? null, beat: earlyInput.n }); earlyInput = null; }
  }
  pendingCheck.push({ n, checkAt: beatTime(n) + WINDOW });
}

function checkHit(t, reason, inputId, beat){

    if (nt.idx <= player.idx && !nt.hit){

}

function freeMove(t, rec){

  if (moveLocked){ texts.push({ s: 'まず1個ブレイク', idx: player.idx, t, col: '#ffffff' }); diagResult(rec, { status: 'invalid', reason: '移動ロック中（最初の1個を壊すまで）' }); return; }

function flashBtn(id){ const b = document.getElementById(id); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 160); }

function doAction(type, n, t, diff, rec){

let earlyInput = null;
// 押した瞬間（イベント発生時刻）を曲の時間に直して採点する。処理待ちで不当にLATEにならないように
function input(type, e, device){
  const handlerPerf = performance.now();
  if (state !== 'play') return;
  const tNow = songTime(), ev = eventPerfTime(e, handlerPerf);
  const delayMs = ev.perf != null ? Math.max(0, handlerPerf - ev.perf) : null;
  const t = tNow - (delayMs ?? 0) / 1000;
  const rec = diagInput(type, e, device, ev, handlerPerf, delayMs, tNow, t);
  if (ev.perf != null && ev.perf < resumePerf){ diagInputEnd(rec, { status: 'invalid', reason: 'ポーズ解除前に押された入力' }); if (type === 'break') diagShow('無効：ポーズ解除前の入力'); return; }
  if (type === 'move'){ diagInputEnd(rec, { status: 'immediate', reason: '進むは判定なし・押した瞬間に実行' }); freeMove(tNow, rec); return; } // 進むは拍に関係なく、押した瞬間に動く
  const n = nearestBeat(t);
  const diff = t - beatTime(n);
  diagTarget(rec, n, t, diff);
  if (Math.abs(diff) > WINDOW || n < 0){
    diagInputEnd(rec, { status: 'miss', judge: 'MISS', lifeLoss: false, reason: (n < 0 ? '最初の拍より前' : '受付時間外') + '（加点なし・ライフは減らない・ノーツはそのまま）', offsetMs: r2(diff * 1000) });
    showJudge('MISS', 'タイミングずれ');
    diagShow('MISS：受付時間外（' + msText(diff * 1000) + '）');
    return;
  }
  if (acted === n){ diagInputEnd(rec, { status: 'invalid', reason: '同じ拍ですでに操作済み' }); diagShow('無効：同じ拍ですでに操作済み'); return; } // 1拍に1回だけ
  if (n < nextBeat){ diagInputEnd(rec, { status: 'immediate', reason: 'その拍の処理は済んでいるので、すぐ実行' }); doAction(type, n, tNow, diff, rec); }  // 拍の処理が済んでいる → すぐ実行
  else { earlyInput = { type, time: t, diff, n, rec }; acted = n; diagInputEnd(rec, { status: 'queued', reason: '拍の処理前なので、その拍まで保留（採点は押した時刻）' }); }
}

// 判定で音を変える：PERFECT＝キーン付きで派手、GREAT＝ふつう、GOOD＝こもった小さめ
// ブロックが動く音（毎拍なので小さめ。拍ぴったりの時刻に予約して鳴らす）
const MOVE_SE_VOL = 0.22;
const moveVoices=new Set();let moveScheduler=null,nextMoveBeat=0;
function stopMoveScheduler(){
  clearInterval(moveScheduler);moveScheduler=null;
  for(const v of moveVoices){try{v.stop();}catch(e){}}moveVoices.clear();
}
function startMoveScheduler(){
  stopMoveScheduler();nextMoveBeat=nextBeat;
  const schedule=()=>{
    if(state!=='play')return;
    const now=ctx.currentTime;
    while(songStart+beatTime(nextMoveBeat)<now+.12){
      const n=nextMoveBeat++,at=songStart+beatTime(n);
      if(at>=now&&n>=INTRO_BEATS&&notes.length)playMoveSE(n,at);
      if(at>=now&&song.local)playGuideClick(n,at);
    }
  };
  moveScheduler=setInterval(schedule,25);schedule();
}
// 自分の曲用のガイド音（拍ごとに「カッ」、4拍ごとに少し高く）
function playGuideClick(n,at){
  const o=ctx.createOscillator(),g=ctx.createGain(),first=n%4===0;
  o.type='square';o.frequency.value=first?1760:1320;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(first?.22:.14,at+.002);g.gain.exponentialRampToValueAtTime(.0001,at+.05);
  o.connect(g);g.connect(ctx.destination);
  moveVoices.add(o);o.onended=()=>{moveVoices.delete(o);o.disconnect();g.disconnect();};
  o.start(at);o.stop(at+.06);
}
function playMoveSE(n,at){
  if (!moveBuf || state !== 'play') return;
  const src = ctx.createBufferSource(), gn = ctx.createGain();
  src.buffer = moveBuf; gn.gain.value = MOVE_SE_VOL;
  src.connect(gn); gn.connect(ctx.destination);
  moveVoices.add(src);src.onended=()=>{moveVoices.delete(src);src.disconnect();gn.disconnect();};
  src.start(at??Math.max(ctx.currentTime,songStart+beatTime(n)));
}
function playSE(word,heroId=selectedHero){
  const custom=characterBreakBuffers[heroId],buffer=custom||breakBuf;
  if (!buffer) return null;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const gain = ctx.createGain(), filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
  if (word === 'PERFECT'){ src.playbackRate.value = 1.08; filt.frequency.value = 20000; gain.gain.value = 1.0; }
  else if (word === 'GREAT'){ src.playbackRate.value = 1.0; filt.frequency.value = 12000; gain.gain.value = 0.85; }
  else { src.playbackRate.value = 0.9; filt.frequency.value = 1800; gain.gain.value = 0.6; }
  if(custom)gain.gain.value*=CHARACTER_SE[heroId].gain;
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  src.onended=()=>{src.disconnect();filt.disconnect();gain.disconnect();if(previewBreakVoice===src)previewBreakVoice=null;};
  src.start(now);
  if (word === 'PERFECT' && !custom){
    // キラーンという高い音を重ねる
    for (const [f, v] of [[2093, .18], [3136, .12], [4186, .07]]){
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      og.gain.setValueAtTime(0, now + .02); og.gain.linearRampToValueAtTime(v, now + .03);
      og.gain.exponentialRampToValueAtTime(.0001, now + .45);
      o.connect(og); og.connect(ctx.destination); o.start(now + .02); o.stop(now + .5);
    }
  }
  return src;
}

// 1,000,000点満点。判定精度×コース到達率。MISSは従来どおり入力ミスも含む。
const SCORE_MAX=1000000;
const JUDGMENT_WEIGHT={PERFECT:1,GREAT:.8,GOOD:.5,MISS:0};
let runHeroId='ninja',runDifficulty='normal',finishedRun=null;
function calculateResult(judgments,progress,clear){
  const total=Object.keys(JUDGMENT_WEIGHT).reduce((n,k)=>n+judgments[k],0);
  const weighted=Object.keys(JUDGMENT_WEIGHT).reduce((n,k)=>n+judgments[k]*JUDGMENT_WEIGHT[k],0);
  const accuracy=total?weighted/total:0;
  if(scoreOn())return{total,accuracy,score:runScore,rank:'—',badge:clear&&total>0?(judgments.PERFECT===total?'ALL PERFECT':judgments.MISS===0?'FULL COMBO':''):''};
  const score=Math.max(0,Math.min(SCORE_MAX,Math.round(SCORE_MAX*accuracy*Math.max(0,Math.min(1,progress)))));
  const rank=!clear?'—':score>=980000?'S':score>=900000?'A':score>=800000?'B':score>=650000?'C':'D';
  const badge=clear&&total>0?(judgments.PERFECT===total?'ALL PERFECT':judgments.MISS===0?'FULL COMBO':'STAGE CLEAR'):'';
  return{total,accuracy,score,rank,badge};
}
function captureResult(clear){
  const judgments={...counts},progress=Math.min(1,player.idx/GOAL_INDEX);
  const result={...calculateResult(judgments,progress,clear),counts:judgments,progress,clear,heroId:runHeroId,difficulty:runDifficulty,songName:song.name,hp:Math.max(0,hp),maxCombo,seconds:Math.max(0,songTime()),beats:Math.max(0,nextBeat),steps:scoreOn()?runSteps:null};
  const key=`neon-blade-best-v1:${song.file}:${runDifficulty}`+(scoreOn()?':score':'');

function detectBeat(buf){
  const sr=buf.sampleRate,d=buf.getChannelData(0),hop=512,fr=sr/hop;
  const len=Math.min(d.length,Math.floor(sr*90));
  const n=Math.floor(len/hop),on=new Float32Array(n);
  // 低音(キック)と、音の立ち上がり(高め)の両方を見る
  let lp=0,x1=0,pl=0,phh=0;
  for(let i=0;i<n;i++){let el=0,eh=0;for(let j=i*hop,k=j+hop;j<k;j++){const x=d[j];lp+=(x-lp)*.05;el+=lp*lp;const h=x-x1;x1=x;eh+=h*h;}
    const vl=Math.log(el+1e-6),vh=Math.log(eh+1e-6);on[i]=i?Math.max(0,vl-pl)+Math.max(0,vh-phh):0;pl=vl;phh=vh;}
  let m=0;for(let i=0;i<n;i++)m+=on[i];m/=n||1;for(let i=0;i<n;i++)on[i]=Math.max(0,on[i]-m);
  const at=x=>{const i=Math.floor(x),f=x-i;return i+1<n?on[i]*(1-f)+on[i+1]*f:0;};
  const score=bpm=>{const L=fr*60/bpm;let s=0;for(let i=0;i+2*L<n;i++)s+=on[i]*(at(i+L)+.5*at(i+2*L));return s;};
  let best=120,bs=-1;
  for(let b=95;b<=175;b+=.5){const v=score(b);if(v>bs){bs=v;best=b;}}
  // テンポと最初のドンを一緒に細かく合わせる
  let fb=best,ph=0,ps=-1;
  for(let b=best-1;b<=best+1;b+=.02){const P=fr*60/b;
    for(let p=0;p<P;p+=.25){let s=0;for(let x=p;x<n;x+=P)s+=at(x);if(s>ps){ps=s;ph=p;fb=b;}}}
  return {bpm:Math.round(fb*10)/10,offset:ph/fr};
}

document.getElementById('myDown').addEventListener('click',()=>nudgeMyBpm(-.5));
document.getElementById('myUp').addEventListener('click',()=>nudgeMyBpm(.5));
myFile.addEventListener('change',async()=>{
  const f=myFile.files&&myFile.files[0];myFile.value='';if(!f)return;
  const lt=document.getElementById('loadTxt');lt.textContent='曲を読みこみ中…';
  try{
    if(ctx.state==='suspended')await ctx.resume();
    const buf=await ctx.decodeAudioData(await f.arrayBuffer());
    lt.textContent='テンポをはかっています…';
    await new Promise(r=>setTimeout(r,30));
    const r=detectBeat(buf);
    const name=f.name.replace(/\.[^.]+$/,'');
    mySong={name,file:'local:'+f.name,bpm:r.bpm,offset:r.offset,baseOffset:r.offset,level:'自分の曲',local:true,buf};
    document.getElementById('myName').textContent=name;showMyBpm();myPanel.classList.remove('hide');
    lt.textContent='BPMがずれてたら −＋ で直してね';
  }catch(e){lt.textContent='この曲は読みこめませんでした。別の曲をえらんでください。';}
});
document.getElementById('myPlay').addEventListener('click',()=>{
  if(!mySong||state!=='ready'||pickingSong)return;
  setSong(mySong);songBuf=mySong.buf;startGame();
});

// ===== 起動 =====
(async () => {
  layout();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  setSong(SONGS[0]);
  const [seAB] = await Promise.all([loadAudio('audio/break.mp3').catch(() => null), ...imgList.map(loadImg), ...CHARACTERS.map(loadHero), loadCharacterSE()]);
  if (seAB) try { breakBuf = await ctx.decodeAudioData(seAB); } catch(e) {}
  loadAudio('audio/block_move.mp3?v=2').then(ab => ctx.decodeAudioData(ab)).then(b => moveBuf = b).catch(() => {});
  loadAudio('audio/goal.mp3').then(ab => ctx.decodeAudioData(ab)).then(b => goalBuf = b).catch(() => {});
  initHeroPicker();reset(); layout();
  state = 'ready';
  document.getElementById('loadTxt').textContent = '曲をえらんでスタート';
  const list = document.getElementById('songList');
  for (const sg of SONGS){
    const b = document.createElement('button'); b.className = 'songBtn' + (sg.hard ? ' hard' : '');
    b.innerHTML = `<span>${sg.name}</span><small>${sg.level}</small>`;
    b.addEventListener('click', () => pickSong(sg, b)); list.appendChild(b);
  }
  const mb=document.createElement('button');mb.className='songBtn';
  mb.innerHTML='<span>📁 自分の曲をえらぶ</span><small>この端末から</small>';
  mb.addEventListener('click',()=>{if(state==='ready'&&!pickingSong)myFile.click();});list.appendChild(mb);
  loop();
})();
</script>
</body>
</html>
